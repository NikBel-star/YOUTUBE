<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<title>Docker</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0f14;
    font-family: 'Segoe UI', sans-serif;
  }

  .card {
    position: relative;
    background: linear-gradient(180deg, #1f2430, #0f1219);
    border: 1px solid #2a2f3a;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    overflow: hidden;
    max-width: 960px;
  }

  .headline {
    margin: 0 0 8px;
    text-align: center;
    color: #7fd6a8;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    user-select: none;
    z-index: 1;
  }

  .subtitle {
    margin: 0 0 20px;
    text-align: center;
    color: #9aa0b0;
    font-size: 13px;
    line-height: 1.6;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }

  .subtitle strong {
    color: #c8cedc;
    font-weight: 600;
  }

  .section-title {
    margin: 18px 0 10px;
    color: #7fd6a8;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    opacity: 0.85;
    text-align: center;
  }

  .section-title:first-of-type {
    margin-top: 0;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  }

  .grid.use-cases {
    grid-template-columns: repeat(4, 1fr);
  }

  .hook {
    padding: 28px 18px;
    text-align: center;
    color: #f2f2f2;
    font-weight: 600;
    font-size: 14px;
    border-right: 1px solid rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
    line-height: 1.3;
  }

  .hook:hover {
    color: #7fd6a8;
    background: rgba(127,214,168,0.1);
    transform: scale(1.03);
  }

  .grid .hook:nth-child(3n) {
    border-right: none;
  }

  .grid.use-cases .hook:nth-child(3n) {
    border-right: 1px solid rgba(255,255,255,0.06);
  }

  .grid.use-cases .hook:nth-child(4n) {
    border-right: none;
  }

  .grid .hook:nth-last-child(-n+3) {
    border-bottom: none;
  }

  .grid.use-cases .hook:nth-last-child(-n+4) {
    border-bottom: none;
  }

  .grid.hook-active .hook:not(:hover) {
    opacity: 0.15;
    filter: blur(2px);
    transition: opacity 0.2s ease, filter 0.2s ease;
  }

  .tooltip {
    position: absolute;
    padding: 10px 16px;
    background: #1a1d24;
    border: 1px solid #3a3f4a;
    border-radius: 10px;
    color: #e0e0e0;
    font-size: 13px;
    line-height: 1.5;
    max-width: 360px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 999;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  }

  .tooltip.visible {
    opacity: 1;
  }

  .tooltip .hook-name {
    color: #7fd6a8;
    font-weight: 700;
    font-size: 14px;
    display: block;
    margin-bottom: 4px;
  }

  .vs-badge {
    display: inline-block;
    margin-top: 16px;
    padding: 8px 14px;
    background: rgba(127,214,168,0.08);
    border: 1px solid rgba(127,214,168,0.18);
    border-radius: 20px;
    color: #9ecfba;
    font-size: 12px;
    font-weight: 500;
    text-align: center;
  }

  .footer {
    margin-top: 14px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <h1 class="headline">Docker</h1>
  <p class="subtitle">
    <strong>Docker</strong> არის ღია კოდის (Open Source) კონტეინერიზაციის პლატფორმა, რომელიც საშუალებას იძლევა აპლიკაცია და მისი ყველა დამოკიდებულება (dependencies, environment setup, libraries) შეფუთოს ერთ იზოლირებულ გარემოში.
  </p>

  <div class="section-title">ძირითადი კონცეფციები</div>
  <div class="grid" id="conceptsGrid"></div>

  <div class="section-title">გამოყენების სფეროები</div>
  <div class="grid use-cases" id="useCasesGrid"></div>

  <div class="tooltip" id="tooltip"></div>
</div>

<script>
  const concepts = [
    "Docker Engine",
    "Image",
    "Container",
    "Docker Registry",
    "Volume",
    "Network"
  ];

  const useCases = [
    "გარემოს სტანდარტიზაცია",
    "Microservices",
    "CI/CD პაიპლაინები",
    "Deployment & Onboarding"
  ];

  const descriptions = {
    "Docker Engine": "პლატფორმის ბირთვი — Client-Server აპლიკაცია (Daemon, REST API, CLI), რომელიც ქმნის და მართავს კონტეინერებს. → Docker-ის გული.",
    "Image": "Read-only შაბლონი (Blueprint) — შეიცავს კოდს, გარემოს ცვლადებსა და ბიბლიოთეკებს. → აპლიკაციის გასაშვებად საჭირო ყველაფერი.",
    "Container": "Image-ის გაშვებული ეგზემპლარი (Executable Instance) — იზოლირებული პროცესი Host სისტემაზე. → მსუბუქი და სწრაფი.",
    "Docker Registry": "Image-ების ცენტრალიზებული საცავი (Docker Hub, AWS ECR) — Push & Pull. → Image-ების გაზიარება.",
    "Volume": "მონაცემების მუდმივი შენახვა (Data Persistence) — ინახავს მონაცემებს Container-ის წაშლის შემდეგაც. → მონაცემთა დაცვა.",
    "Network": "უზრუნველყოფს იზოლირებულ კომუნიკაციას კონტეინერებსა და Host-ს შორის. → უსაფრთხო ქსელი.",
    "გარემოს სტანდარტიზაცია": "\"It works on my machine\" პრობლემის აღმოფხვრა — Development, Staging და Production აბსოლუტურად იდენტურია. → ერთიანი გარემო.",
    "Microservices": "თითოეული მიკროსერვისის იზოლირებულად შეფუთვა, გაშვება და დამოუკიდებელი მასშტაბირება (Scaling). → დამოუკიდებელი სერვისები.",
    "CI/CD პაიპლაინები": "ავტომატიზირებული ტესტირება და Build სუფთა, დროებით კონტეინერებში. → სწრაფი და სუფთა პაიპლაინი.",
    "Deployment & Onboarding": "სწრაფი Deployment და ახალი დეველოპერის ჩართვა წამებში, გარემოს ხელით კონფიგურაციის გარეშე. → წამებში მზად."
  };

  const conceptsGrid = document.getElementById("conceptsGrid");
  const useCasesGrid = document.getElementById("useCasesGrid");
  const tooltip = document.getElementById("tooltip");
  const card = document.getElementById("card");

  function createHook(name, grid) {
    const div = document.createElement("div");
    div.className = "hook";
    div.textContent = name;

    div.addEventListener("mouseenter", () => {
      // dim both grids
      document.querySelectorAll(".grid").forEach(g => g.classList.add("hook-active"));
      tooltip.innerHTML = `<span class="hook-name">${name}</span>${descriptions[name] || ""}`;
      tooltip.classList.add("visible");
      positionTooltip(div);
    });

    div.addEventListener("mouseleave", () => {
      document.querySelectorAll(".grid").forEach(g => g.classList.remove("hook-active"));
      tooltip.classList.remove("visible");
    });

    div.addEventListener("click", () => {
      navigator.clipboard.writeText(name);
      div.style.color = "#7fd6a8";
      setTimeout(() => div.style.color = "#f2f2f2", 500);
    });

    grid.appendChild(div);
  }

  concepts.forEach(name => createHook(name, conceptsGrid));
  useCases.forEach(name => createHook(name, useCasesGrid));

  function positionTooltip(hookEl) {
    const hookRect = hookEl.getBoundingClientRect();
    const cardRect = card.getBoundingClientRect();
    const gap = 12;

    let left = hookRect.left - cardRect.left + (hookRect.width / 2);
    let top = hookRect.top - cardRect.top - gap;

    tooltip.style.left = "0px";
    tooltip.style.top = "0px";
    tooltip.style.visibility = "hidden";
    tooltip.style.display = "block";

    const tipRect = tooltip.getBoundingClientRect();

    left = left - (tipRect.width / 2);

    if (left < 0) left = 0;
    if (left + tipRect.width > cardRect.width) {
      left = cardRect.width - tipRect.width;
    }

    top = top - tipRect.height;
    if (top < 0) {
      top = hookRect.top - cardRect.top + hookRect.height + gap;
    }

    tooltip.style.left = left + "px";
    tooltip.style.top = top + "px";
    tooltip.style.visibility = "visible";
  }
</script>

</body>
</html>
