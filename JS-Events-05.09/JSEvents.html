<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Events — კატეგორიების მიხედვით</title>
<style>
  :root {
    --bg: #0b0e13;
    --bg2: #0d0f14;
    --card: linear-gradient(180deg, #1b2130, #0f131d);
    --card-border: #2a3140;
    --text: #eef1f7;
    --muted: #9aa3b5;
    --accent: #7fd6a8;
    --tooltip-bg: #1a1f2b;
    --tooltip-border: #353e52;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(127,214,168,0.08), transparent 60%),
      radial-gradient(1000px 500px at 0% 10%, rgba(88,166,255,0.06), transparent 55%),
      var(--bg);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    line-height: 1.6;
  }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px 80px;
    width: 100%;
  }

  /* Sticky site header: brand left, language toggle right */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 900;
    width: 100%;
    background: rgba(11, 14, 19, 0.85);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  }

  .site-header-inner {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    font-family: inherit;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.5px;
    white-space: nowrap;
    background: linear-gradient(90deg, #9fe8c0, #7fd6a8, #6fb5ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    user-select: none;
    border: none;
    padding: 0;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.2s ease;
  }

  .brand:hover {
    filter: brightness(1.15);
    transform: scale(1.03);
  }

  /* Hero: initial viewport — min 100svh height, full width */
  .hero {
    min-height: calc(100svh - 57px);
    min-width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 14px 0 48px;
  }

  .page-heading {
    margin: 0 0 16px;
    text-align: center;
    color: var(--muted);
    font-size: 20px;
    font-weight: 700;
  }

  .langbar {
    display: inline-flex;
    gap: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 4px;
  }

  .langbar button {
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .langbar button:hover {
    color: var(--text);
  }

  .langbar button.active {
    background: rgba(127,214,168,0.16);
    color: var(--accent);
    box-shadow: inset 0 0 0 1px rgba(127,214,168,0.4);
  }

  .section-label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
    margin: 10px 0 16px;
    text-align: center;
  }

  /* Categories grid — 7 columns × 3 rows fills the viewport */
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 1fr;
    gap: 10px;
    flex: 1;
    align-content: center;
  }

  .cat {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    overflow: visible;
    --cat: #7fd6a8;
  }

  .cat:hover {
    transform: scale(1.04);
    border-color: var(--cat);
    box-shadow: 0 8px 26px rgba(0,0,0,0.45), 0 0 0 1px var(--cat) inset;
  }

  .cat .icon {
    font-size: 22px;
    line-height: 1;
  }

  .cat .name {
    font-weight: 700;
    font-size: 12.5px;
    line-height: 1.35;
    color: var(--text);
  }

  .cat .count {
    font-size: 10px;
    color: var(--muted);
    background: rgba(255,255,255,0.05);
    border-radius: 999px;
    padding: 1px 8px;
    white-space: nowrap;
  }

  .cat:hover .count {
    color: var(--cat);
    background: color-mix(in srgb, var(--cat) 15%, transparent);
  }

  .grid.dimming .cat:not(:hover) {
    opacity: 0.18;
    filter: blur(2.5px);
    transition: opacity 0.2s ease, filter 0.2s ease;
  }

  .cat.active {
    border-color: var(--cat);
    box-shadow: 0 0 0 1px var(--cat) inset, 0 8px 26px rgba(0,0,0,0.45);
  }

  .cat.active .count {
    color: var(--cat);
  }

  /* Compact sticky nav — narrow buttons, icon on the left */
  .compact-nav {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    border-top: 1px solid transparent;
    transition: max-height 0.25s ease, opacity 0.2s ease;
  }

  .site-header.nav-visible .compact-nav {
    max-height: 180px;
    opacity: 1;
    border-top-color: rgba(255,255,255,0.07);
  }

  .compact-nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 8px 24px 10px;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--muted);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 10px;
    padding: 5px 8px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    --cat: #7fd6a8;
  }

  .pill .pic {
    flex: 0 0 auto;
    font-size: 14px;
    line-height: 1;
  }

  .pill:hover {
    color: var(--text);
    border-color: var(--cat);
  }

  .pill.active {
    color: var(--cat);
    border-color: var(--cat);
    background: color-mix(in srgb, var(--cat) 14%, transparent);
    box-shadow: 0 0 0 1px var(--cat) inset, 0 4px 14px rgba(0,0,0,0.35);
  }

  /* Tooltip */
  .tooltip {
    position: fixed;
    padding: 12px 16px;
    background: var(--tooltip-bg);
    border: 1px solid var(--tooltip-border);
    border-radius: 12px;
    color: #e6eaf2;
    font-size: 13px;
    line-height: 1.55;
    max-width: 340px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 1000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.55);
  }

  .tooltip.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .tooltip .tt-name {
    color: var(--tt-color, var(--accent));
    font-weight: 700;
    font-size: 14px;
    display: block;
    margin-bottom: 3px;
  }

  .tooltip .tt-events {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    word-break: break-word;
  }

  /* Sections */
  .sections {
    margin-top: 0;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .sections.has-selection {
    margin-top: 24px;
  }

  .section {
    display: none;
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 24px 26px;
    scroll-margin-top: 84px;
    --cat: #7fd6a8;
  }

  .section.visible {
    display: block;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .section-title .icon {
    font-size: 26px;
  }

  .section-title h2 {
    margin: 0;
    font-size: 21px;
    font-weight: 800;
    color: var(--cat);
  }

  .section .desc {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 16px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }

  .chip {
    font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace;
    font-size: 12.5px;
    background: rgba(127,214,168,0.08);
    border: 1px solid color-mix(in srgb, var(--cat) 35%, transparent);
    color: var(--cat);
    border-radius: 999px;
    padding: 4px 12px;
  }

  .dlist {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 0;
    margin: 0;
    list-style: none;
  }

  .dlist li {
    font-size: 13.5px;
    color: #d6dcea;
    padding-left: 18px;
    position: relative;
  }

  .dlist li::before {
    content: '';
    position: absolute;
    left: 2px;
    top: 0.72em;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cat);
  }

  .dlist li b {
    color: var(--cat);
    font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace;
    font-weight: 600;
  }

  .to-top {
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(127,214,168,0.14);
    border: 1px solid rgba(127,214,168,0.4);
    color: var(--accent);
    font-size: 20px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: all 0.25s ease;
  }

  .to-top.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .to-top:hover {
    background: rgba(127,214,168,0.24);
  }

  @media (max-width: 1024px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
    .hero { min-height: auto; }
    .site-header.nav-visible .compact-nav { max-height: 62px; }
    .compact-nav-inner {
      display: flex;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .compact-nav-inner::-webkit-scrollbar { height: 6px; }
    .compact-nav-inner::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.16);
      border-radius: 999px;
    }
    .pill { flex: 0 0 auto; white-space: nowrap; border-radius: 999px; }
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
    .brand { font-size: 17px; }
    .langbar button { padding: 7px 14px; font-size: 13px; }
  }
  @media (max-width: 440px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="site-header-inner">
    <button class="brand" id="brandBtn" type="button" title="JavaScript Events">JavaScript Events</button>
    <div class="langbar" id="langbar">
      <button data-lang="ka" class="active">ქარ</button>
      <button data-lang="en">En</button>
      <button data-lang="ru">Рус</button>
    </div>
  </div>
  <nav class="compact-nav" aria-label="Categories">
    <div class="compact-nav-inner" id="compactInner"></div>
  </nav>
</header>

<div class="wrap">
  <section class="hero" id="hero">
    <h2 class="page-heading" data-i18n="tagline">JavaScript Events — 21 კატეგორია</h2>
    <div class="grid" id="grid"></div>
  </section>

  <div class="section-label" id="detailLabel" data-i18n="detailLabel" style="display:none">დეტალური მიმოხილვა</div>
  <div class="sections" id="sections"></div>
</div>

<button class="to-top" id="toTop" title="↑">↑</button>
<div class="tooltip" id="tooltip"></div>

<script>
/* ============================================================
   DATA — 21 კატეგორია × 3 ენა (ka / en / ru)
   ============================================================ */
const DATA = {
  ka: {
    title: "JavaScript Events",
    tagline: "JavaScript Events — 21 კატეგორია",
    catLabel: "კატეგორიები",
    detailLabel: "დეტალური მიმოხილვა",
    countLabel: "ივენთი",
    items: [
      {
        id: "mouse", icon: "🖱️", color: "#7fd6a8",
        name: "Mouse Events",
        short: "მაუსის მოქმედებებთან დაკავშირებული ივენთები (დაჭერა, გადაადგილება, ჰოვერი).",
        events: ["click","dblclick","mousedown","mouseup","mousemove","mouseenter","mouseleave","mouseover","mouseout","contextmenu","auxclick","wheel"],
        desc: [
          ["click","ხდება, როცა ელემენტზე თაგუნათი დაწკაპუნება ხდება (mousedown + mouseup ერთსა და იმავე ელემენტზე)."],
          ["dblclick","სწრაფად ორმაგი დაწკაპუნებისას (double-click) ფაიერდება."],
          ["mousedown","მაუსის ღილაკის დაჭერის მომენტში ხდება (ჯერ არ ათავისუფლებს)."],
          ["mouseup","მაუსის ღილაკის გათავისუფლების მომენტში ხდება."],
          ["mousemove","ხდება მაუსის კურსორის ნებისმიერ გადაადგილებაზე ელემენტის ფარგლებში."],
          ["mouseenter","მაუსის ელემენტში შესვლისას ფაიერდება, არ ბუშტდება (doesn't bubble), მოქმედებს მხოლოდ ტარგეტ ელემენტზე."],
          ["mouseleave","მაუსის ელემენტიდან გასვლისას ფაიერდება, ასევე არ ბუშტდება."],
          ["mouseover","მაუსის ელემენტზე ან მის შვილობილ ელემენტზე შესვლისას ხდება, ბუშტდება (bubbles)."],
          ["mouseout","მაუსის ელემენტიდან ან მისი შვილობილიდან გასვლისას ხდება, ასევე ბუშტდება."],
          ["contextmenu","მარჯვენა ღილაკზე დაწკაპუნებისას (right-click) ხდება, კონტექსტური მენიუს გამოძახებამდე."],
          ["auxclick","ხდება არა-პირველადი ღილაკით დაწკაპუნებისას (მაგ. middle-click), click-ისგან განსხვავებით."],
          ["wheel","მაუსის ბორბლის (scroll wheel) ბრუნვისას ხდება."]
        ]
      },
      {
        id: "keyboard", icon: "⌨️", color: "#f5a97f",
        name: "Keyboard Events",
        short: "კლავიატურაზე ღილაკების დაჭერასთან დაკავშირებული ივენთები.",
        events: ["keydown","keyup","keypress (deprecated)"],
        desc: [
          ["keydown","ხდება კლავიშის დაჭერის მომენტში, გრძელდება რეპიტით თუ დაჭერილი ჩავარდება (holding)."],
          ["keyup","ხდება კლავიშის გათავისუფლების მომენტში."],
          ["keypress (deprecated)","ადრე ფაიერდებოდა სიმბოლოს გენერაციისას (მხოლოდ character-key-ებზე), ამჟამად რეკომენდებულია keydown/input-ის გამოყენება."]
        ]
      },
      {
        id: "form", icon: "📝", color: "#8bd5ff",
        name: "Form Events",
        short: "ფორმებთან და input ველებთან დაკავშირებული ივენთები (გაგზავნა, მნიშვნელობის ცვლილება).",
        events: ["submit","reset","change","input","invalid","select","formdata"],
        desc: [
          ["submit","ხდება ფორმის გაგზავნის მომენტში (submit ღილაკზე დაჭერით ან Enter-ით)."],
          ["reset","ხდება ფორმის საწყის მდგომარეობაში დაბრუნებისას (reset ღილაკზე დაჭერით)."],
          ["change","ფაიერდება, როცა input-ის მნიშვნელობა შეიცვალა და ელემენტმა ფოკუსი დაკარგა (commit-ის შემდეგ)."],
          ["input","ფაიერდება უშუალოდ მნიშვნელობის ცვლილებისას, რეალურ დროში (ყოველი keystroke-ის შემდეგ)."],
          ["invalid","ხდება, როცა ველი ვერ გადის ვალიდაციას submit-ის დროს (მაგ. required ველი ცარიელია)."],
          ["select","ფაიერდება, როცა ტექსტი მონიშნულია input/textarea ელემენტში."],
          ["formdata","ხდება ფორმის მონაცემების FormData ობიექტში აწყობისას (submit-ის დროს)."]
        ]
      },
      {
        id: "focus", icon: "🎯", color: "#ffd28a",
        name: "Focus Events",
        short: "ელემენტზე ფოკუსის მიღება/დაკარგვასთან დაკავშირებული ივენთები.",
        events: ["focus","blur","focusin","focusout"],
        desc: [
          ["focus","ხდება ელემენტზე ფოკუსის მიღების მომენტში, არ ბუშტდება (doesn't bubble)."],
          ["blur","ხდება ელემენტზე ფოკუსის დაკარგვის მომენტში, ასევე არ ბუშტდება."],
          ["focusin","იგივეა რაც focus, მაგრამ ბუშტდება (bubbles), შეიძლება parent ელემენტზეც დაიჭიროთ."],
          ["focusout","იგივეა რაც blur, მაგრამ ბუშტდება."]
        ]
      },
      {
        id: "clipboard", icon: "📋", color: "#c8a6ff",
        name: "Clipboard Events",
        short: "კოპირება/ამოჭრა/ჩასმის მოქმედებებთან დაკავშირებული ივენთები.",
        events: ["copy","cut","paste"],
        desc: [

const tooltipEl = document.getElementById("tooltip");
const toTopEl = document.getElementById("toTop");
const headerEl = document.getElementById("siteHeader");
const heroEl = document.getElementById("hero");
const compactInner = document.getElementById("compactInner");
const detailLabelEl = document.getElementById("detailLabel");
let activeId = null;
let spy = null;

function render() {
  const d = DATA[currentLang];
  document.title = d.title;
  document.documentElement.lang = currentLang;

  // static i18n labels
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (d[key]) el.textContent = d[key];
  });

  // language buttons
  document.querySelectorAll("#langbar button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === currentLang);
  });

  // grid
  gridEl.innerHTML = "";
  d.items.forEach(cat => {
    const card = document.createElement("div");
    card.className = "cat";
    card.style.setProperty("--cat", cat.color);
    card.dataset.id = cat.id;
    card.innerHTML =
      '<span class="icon">' + cat.icon + '</span>' +
      '<span class="name"></span>' +
      '<span class="count"></span>';
    card.querySelector(".name").textContent = cat.name;
    card.querySelector(".count").textContent = cat.events.length + " " + d.countLabel;

    card.addEventListener("mouseenter", (e) => {
      gridEl.classList.add("dimming");
      showTooltip(card, cat);
    });
    card.addEventListener("mouseleave", () => {
      gridEl.classList.remove("dimming");
      hideTooltip();
    });
    card.addEventListener("click", () => {
      setActive(cat.id);
      showOnly(cat.id);
      const section = document.getElementById("sec-" + cat.id);
      if (section) section.scrollIntoView({ behavior: "smooth", block: "center" });
    });

    gridEl.appendChild(card);
  });

  // sections
  sectionsEl.innerHTML = "";
  d.items.forEach(cat => {
    const sec = document.createElement("section");
    sec.className = "section";
    sec.id = "sec-" + cat.id;
    sec.style.setProperty("--cat", cat.color);

    const chips = cat.events.map(ev => '<span class="chip"></span>');
    const list = cat.desc.map(([name, text]) => {
      return '<li><b>' + escapeHtml(name) + '</b> — ' + escapeHtml(text) + '</li>';
    }).join("");

    sec.innerHTML =
      '<div class="section-title"><span class="icon">' + cat.icon + '</span><h2></h2></div>' +
      '<p class="desc"></p>' +
      '<div class="chips"></div>' +
      '<ul class="dlist">' + list + '</ul>';

    sec.querySelector("h2").textContent = cat.name;
    sec.querySelector(".desc").textContent = cat.short;
    const chipsBox = sec.querySelector(".chips");
    cat.events.forEach(ev => {
      const c = document.createElement("span");
      c.className = "chip";
      c.textContent = ev;
      chipsBox.appendChild(c);
    });

    sectionsEl.appendChild(sec);
  });

  // compact sticky nav pills
  compactInner.innerHTML = "";
  d.items.forEach(cat => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pill";
    b.dataset.id = cat.id;
    b.style.setProperty("--cat", cat.color);
    b.title = cat.name;
    const ic = document.createElement("span");
    ic.className = "pic";
    ic.textContent = cat.icon;
    const nm = document.createElement("span");
    nm.className = "pname";
    nm.textContent = cat.name;
    b.appendChild(ic);
    b.appendChild(nm);
    b.addEventListener("click", () => {
      const section = document.getElementById("sec-" + cat.id);
      if (!section) return;
      // bring the clicked section right below the sticky nav
      if (sectionsEl.firstElementChild !== section) {
        sectionsEl.prepend(section);
      }
      setActive(cat.id);
      showOnly(cat.id);
      section.style.scrollMarginTop = (headerEl.offsetHeight + 12) + "px";
      section.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    compactInner.appendChild(b);
  });

  // scroll-spy: mark the category currently in view
  if (spy) spy.disconnect();
  if (typeof IntersectionObserver !== "undefined") {
    spy = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) setActive(en.target.id.replace("sec-", ""));
      });
    }, { rootMargin: "-35% 0px -55% 0px" });
    sectionsEl.querySelectorAll(".section").forEach(s => spy.observe(s));
  }

  setActive(activeId);
  showOnly(activeId);
  updateNav();
}

/* Show only the selected section; hide all detail content when nothing is selected */
function showOnly(id) {
  const sel = id ? "sec-" + id : null;
  sectionsEl.querySelectorAll(".section").forEach(s => {
    s.classList.toggle("visible", sel !== null && s.id === sel);
  });
  if (detailLabelEl) detailLabelEl.style.display = id ? "" : "none";
  sectionsEl.classList.toggle("has-selection", !!id);
}

function setActive(id) {
  activeId = id;
  gridEl.querySelectorAll(".cat").forEach(c => {
    c.classList.toggle("active", c.dataset.id === id);
  });
  compactInner.querySelectorAll(".pill").forEach(p => {
    p.classList.toggle("active", p.dataset.id === id);
  });
  const active = compactInner.querySelector(".pill.active");
  if (active && headerEl.classList.contains("nav-visible")) {
    const pr = active.getBoundingClientRect();
    const cr = compactInner.getBoundingClientRect();
    if (pr.left < cr.left || pr.right > cr.right) {
      compactInner.scrollTo({
        left: compactInner.scrollLeft + (pr.left - cr.left) - 16,
        behavior: "smooth"
      });
    }
  }
}

/* Compact nav visibility — show once the hero grid is scrolled away */
function updateNav() {
  if (!heroEl || !headerEl) return;
  const r = heroEl.getBoundingClientRect();
  headerEl.classList.toggle("nav-visible", r.bottom < 90);
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* Tooltip */
function showTooltip(card, cat) {
  tooltipEl.style.setProperty("--tt-color", cat.color);
  tooltipEl.innerHTML =
    '<span class="tt-name">' + cat.icon + " " + escapeHtml(cat.name) + '</span>' +
    escapeHtml(cat.short) +
    '<span class="tt-events">' + escapeHtml(cat.events.join(", ")) + '</span>';
  tooltipEl.classList.add("visible");
  positionTooltip(card);
}

function hideTooltip() {
  tooltipEl.classList.remove("visible");
}

function positionTooltip(card) {
  const r = card.getBoundingClientRect();
  const gap = 14;
  let left = r.left + (r.width / 2);
  let top = r.top - gap;

  tooltipEl.style.left = "0px";
  tooltipEl.style.top = "0px";
  tooltipEl.style.visibility = "hidden";
  tooltipEl.style.display = "block";

  const tr = tooltipEl.getBoundingClientRect();

  left = left - (tr.width / 2);
  if (left < 12) left = 12;
  if (left + tr.width > window.innerWidth - 12) {
    left = window.innerWidth - tr.width - 12;
  }

  top = top - tr.height;
  if (top < 12) {
    top = r.bottom + gap;
  }

  tooltipEl.style.left = left + "px";
  tooltipEl.style.top = top + "px";
  tooltipEl.style.visibility = "visible";
}

/* Language switch */
document.getElementById("langbar").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-lang]");
  if (!btn) return;
  currentLang = btn.dataset.lang;
  render();
  hideTooltip();
});

/* Scroll to top button + compact nav visibility */
window.addEventListener("scroll", () => {
  toTopEl.classList.toggle("show", window.scrollY > 500);
  updateNav();
}, { passive: true });

toTopEl.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: "smooth" });
});

/* Brand button — back to the categories grid at the top */
document.getElementById("brandBtn").addEventListener("click", () => {
  hideTooltip();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

render();
</script>

</body>
</html>
